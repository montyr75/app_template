name: app_template
description: "The kernel every new Flutter app starts from (../ARCHITECTURE.md)."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2

dependencies:
  awesome_flutter_extensions: ^2.0.1
  cloud_firestore: ^6.10.0
  dart_mappable: ^4.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_smart_dialog: ^5.3.0
  formz: ^0.8.1
  go_router: ^18.0.1
  intl: any
  logging: ^1.3.0
  # Regular dependencies because main.dart imports them; the kDebugMode gate keeps the binding out of release builds.
  # They move together with the marionette_cli and marionette_mcp global tools (same minor version).
  marionette_flutter: ^0.7.0
  marionette_logging: ^0.7.0
  material_ui: ^1.6.0
  package_info_plus: ^10.2.1
  recase: ^4.1.0
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  tinycolor2: ^3.0.1
  uuid: ^4.6.0
  validators: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.1
  dart_mappable_builder: ^4.10.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # The emulator tests wipe the emulators over their REST endpoints.
  http: ^1.6.0
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonts are bundled offline as variable TTFs under assets/fonts/, each with its license file beside it, and named
  # here as families; the theme file names the families (ARCHITECTURE.md §9). The kernel ships none.
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter.ttf
