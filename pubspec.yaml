name: app_template
description: "An app template."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2

dependencies:
  awesome_flutter_extensions: ^2.0.1
  dart_mappable: ^4.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flex_color_scheme: ^9.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_smart_dialog: ^5.3.0
  formz: ^0.8.1
  go_router: ^18.0.1
  intl: any
  logging: ^1.3.0
  material_ui: ^1.4.0
  package_info_plus: ^10.2.1
  recase: ^4.1.0
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  tinycolor2: ^3.0.1
  validators: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.1
  dart_mappable_builder: ^4.10.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
